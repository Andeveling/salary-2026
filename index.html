<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Salarial IT Colombia 2026 + IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Archivo+Black&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"JetBrains Mono"', 'monospace'],
                        display: ['"Archivo Black"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        black: '#000000',
                        white: '#ffffff',
                        'neon-blue': '#3B82F6',
                        'neon-green': '#A3E635',
                        'neon-purple': '#D946EF',
                        'neon-yellow': '#FACC15',
                        'bg-grid': '#f0f0f0'
                    },
                    boxShadow: {
                        'hard': '4px 4px 0px 0px #000000',
                        'hard-sm': '2px 2px 0px 0px #000000',
                        'hard-lg': '8px 8px 0px 0px #000000',
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #e5e5e5; 
            background-image: radial-gradient(#000 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .brutal-border {
            border: 2px solid #000;
        }
        .brutal-btn {
            background-color: white;
            border: 2px solid black;
            box-shadow: 4px 4px 0px 0px #000;
            transition: all 0.1s;
        }
        .brutal-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px #000;
        }
        .brutal-input {
            border: 2px solid black;
            border-radius: 0;
            background: white;
            box-shadow: 2px 2px 0px 0px #000;
        }
        .brutal-input:focus {
            outline: none;
            background: #fff;
            box-shadow: 4px 4px 0px 0px #000;
        }
        .range-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 10px;
            background: #fff;
            border: 2px solid #000;
            outline: none;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #000;
            cursor: pointer;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
